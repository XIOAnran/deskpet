name: 构建小海桌宠

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖
      shell: pwsh
      run: |
        python -m pip install --upgrade pip
        if (Test-Path '.\requirements.txt') {
          pip install -r requirements.txt
        } else {
          pip install PyQt5 pillow pyinstaller
        }

    - name: 生成图标与处理图片
      shell: pwsh
      run: |
        # 如果没有去背景图片则尝试自动生成
        if (-not (Test-Path '.\character_nobg.png')) {
          if ((Test-Path '.\character.jpg') -or (Test-Path '.\character.png')) {
            python remove_bg.py
          } else {
            Write-Host "未找到 character.jpg/character.png，跳过去背景步骤"
          }
        } else {
          Write-Host "character_nobg.png 已存在，跳过去背景"
        }

        # 生成 icon.ico（make_icon.py 会根据存在的图片生成）
        python make_icon.py

    - name: 构建 EXE
      shell: pwsh
      run: |
        # 动态构造参数：只有在文件存在时才传 --add-data / --icon，避免因文件缺失失败
        $addArg = ""
        if (Test-Path '.\character_nobg.png') {
          $addArg = "--add-data `\"character_nobg.png;.`\""
        } else {
          Write-Host "character_nobg.png 不存在，将不传 --add-data 参数"
        }

        $iconArg = ""
        if (Test-Path '.\icon.ico') {
          $iconArg = "--icon `\"icon.ico`\""
        } else {
          Write-Host "icon.ico 不存在，将不传 --icon 参数"
        }

        # 执行 pyinstaller（$addArg/$iconArg 可能为空）
        pyinstaller --onefile --windowed --name "小海桌宠" $addArg $iconArg --hidden-import PyQt5.sip --clean --noconfirm deskpet.py

    - name: 上传产物
      uses: actions/upload-artifact@v4
      with:
        name: 小海桌宠
        path: dist/*.exe
