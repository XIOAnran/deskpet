name: 构建小海桌宠

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: 安装依赖
      run: |
        pip install PyQt5 pillow pyinstaller
    
    - name: 构建 EXE
      run: pyinstaller --onefile --windowed --name "小海桌宠" --icon icon.ico --hidden-import PyQt5.sip deskpet.py
    
    - name: 上传产物
      uses: actions/upload-artifact@v4
      with:
        name: 小海桌宠
        path: dist/小海桌宠.exe
